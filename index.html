<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="es" style="background-color: #8c8c8c">
<head>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="author" content="casa">
<title>Costa Adeje</title>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Turn.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style type="text/css">
body { 
    background-color: #fff; 
    margin-top: 2%; 
    margin-left: 4%; 
    margin-right: 4%; 
    margin-bottom: 2%; 
    padding: 4%; 
    border-width: 1px; 
    border-color: black; 
    border-style: solid; 
}

.topnav { 
    background-color: #4CAF50; 
    overflow: hidden; 
}

.topnav a { 
    float: left; 
    display: block; 
    color: #f2f2f2; 
    text-align: center; 
    padding: 18px 20px; 
    text-decoration: none; 
    font-size: 21px; 
}

.topnav a:hover { 
    background-color: #ddd; 
    color: black; 
}

.topnav a.active { 
    background-color: #04AA6D; 
    color: white; 
}

/* Título principal */
.main-title {
    color: #E36C0A;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 48pt;
    text-align: center;
    margin: 30px 0;
}

/* Container de los PDFs */
.pdfs-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin: 40px 0;
}

.pdf-box {
    padding: 25px;
    background-color: #fff;
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
}

.pdf-box:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

.pdf-title {
    color: #E36C0A;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 28pt;
    text-align: center;
    margin-bottom: 20px;
    margin-top: 0;
}

/* Portada del PDF */
.pdf-cover {
    width: 100%;
    height: 400px;
    background-color: #f0f0f0;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #666;
    margin-bottom: 20px;
}

.pdf-cover img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.open-btn {
    display: block;
    background-color: #4CAF50;
    color: white;
    text-align: center;
    padding: 15px 20px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    border-radius: 5px;
    border: none;
    cursor: pointer;
    width: 100%;
    margin-bottom: 10px;
}

.open-btn:hover {
    background-color: #04AA6D;
}

.download-btn {
    display: block;
    background-color: #E36C0A;
    color: white;
    text-align: center;
    padding: 12px 20px;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    border-radius: 5px;
}

.download-btn:hover {
    opacity: 0.8;
}

/* MODAL LIGHTBOX */
.flipbook-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.95);
    z-index: 9999;
    overflow: hidden;
}

.flipbook-modal.active {
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-content {
    position: relative;
    width: 90%;
    max-width: 1200px;
    height: 90%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.flipbook-viewer {
    position: relative;
}

.flipbook {
    box-shadow: 0 15px 60px rgba(0,0,0,0.8);
}

.flipbook .page {
    background-color: #fff;
    background-size: 100% 100% !important;
    background-position: center !important;
    background-repeat: no-repeat !important;
}

/* Flechas de navegación */
.nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background-color: rgba(255, 255, 255, 0.9);
    color: #333;
    border: none;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    font-size: 24px;
    cursor: pointer;
    z-index: 10000;
    transition: all 0.3s;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.nav-arrow:hover {
    background-color: #4CAF50;
    color: white;
    transform: translateY(-50%) scale(1.1);
}

.nav-arrow:disabled {
    opacity: 0.3;
    cursor: not-allowed;
}

.nav-arrow.left {
    left: 20px;
}

.nav-arrow.right {
    right: 20px;
}

/* Botón cerrar */
.close-modal {
    position: absolute;
    top: 20px;
    right: 20px;
    background-color: rgba(255, 255, 255, 0.9);
    color: #333;
    border: none;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    font-size: 28px;
    cursor: pointer;
    z-index: 10001;
    line-height: 1;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.close-modal:hover {
    background-color: #E36C0A;
    color: white;
}

/* Indicador de página */
.page-counter {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background-color: rgba(255, 255, 255, 0.9);
    color: #333;
    padding: 10px 20px;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    z-index: 10000;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}

.loading {
    text-align: center;
    padding: 50px;
    color: #999;
    font-size: 18px;
}

/* Responsive */
@media (max-width: 1024px) {
    .pdfs-container {
        grid-template-columns: 1fr;
    }
    
    .main-title {
        font-size: 36pt;
    }
    
    .pdf-title {
        font-size: 24pt;
    }
}
</style>
</head>
<body>

<!-- Menú superior -->
<div class="topnav" id="myTopnav">
    <a href="index.html" class="active">Inicio</a>
    <a href="index.html">Anterior</a>
    <a href="rutas1.html">Siguiente</a>
</div>

<br>

<!-- Título principal -->
<div class="main-title">
    COSTA ADEJE<br>TENERIFE
</div>

<!-- Container de los PDFs -->
<div class="pdfs-container">
    
    <!-- PDF 1: Español -->
    <div class="pdf-box">
        <h2 class="pdf-title">Rutas en Español</h2>
        <div class="pdf-cover" id="cover-es">
            <p>📄 Click para abrir</p>
        </div>
        <button class="open-btn" onclick="openFlipbook('es')">📖 Abrir Guía</button>
        <a href="Guia Rutas Tenerife Español.pdf" download class="download-btn">⬇ Descargar PDF</a>
    </div>
    
    <!-- PDF 2: Inglés -->
    <div class="pdf-box">
        <h2 class="pdf-title">Routes in English</h2>
        <div class="pdf-cover" id="cover-en">
            <p>📄 Click to open</p>
        </div>
        <button class="open-btn" onclick="openFlipbook('en')">📖 Open Guide</button>
        <a href="Guide Rutas Tenerifes English.pdf" download class="download-btn">⬇ Download PDF</a>
    </div>
    
</div>

<!-- MODAL LIGHTBOX ESPAÑOL -->
<div class="flipbook-modal" id="modal-es">
    <button class="close-modal" onclick="closeFlipbook('es')">✕</button>
    <button class="nav-arrow left" id="prev-es">‹</button>
    <button class="nav-arrow right" id="next-es">›</button>
    <div class="page-counter" id="counter-es">Página 1</div>
    
    <div class="modal-content">
        <div class="flipbook-viewer">
            <div id="flipbook-es" class="flipbook">
                <div class="loading">Cargando PDF...</div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL LIGHTBOX INGLÉS -->
<div class="flipbook-modal" id="modal-en">
    <button class="close-modal" onclick="closeFlipbook('en')">✕</button>
    <button class="nav-arrow left" id="prev-en">‹</button>
    <button class="nav-arrow right" id="next-en">›</button>
    <div class="page-counter" id="counter-en">Page 1</div>
    
    <div class="modal-content">
        <div class="flipbook-viewer">
            <div id="flipbook-en" class="flipbook">
                <div class="loading">Loading PDF...</div>
            </div>
        </div>
    </div>
</div>

<script>
// Configurar PDF.js
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// Estado de los flipbooks
const flipbooksLoaded = {
    es: false,
    en: false
};

const pdfConfig = {
    es: {
        url: 'Guia Rutas Tenerife Español.pdf',
        flipbookId: '#flipbook-es',
        modalId: '#modal-es',
        prevBtn: '#prev-es',
        nextBtn: '#next-es',
        counterId: '#counter-es',
        coverId: '#cover-es',
        pageText: 'Página'
    },
    en: {
        url: 'Guide Rutas Tenerifes English.pdf',
        flipbookId: '#flipbook-en',
        modalId: '#modal-en',
        prevBtn: '#prev-en',
        nextBtn: '#next-en',
        counterId: '#counter-en',
        coverId: '#cover-en',
        pageText: 'Page'
    }
};

// Función para abrir flipbook en modal
function openFlipbook(lang) {
    const config = pdfConfig[lang];
    $(config.modalId).addClass('active');
    
    // Cargar PDF si no está cargado
    if (!flipbooksLoaded[lang]) {
        createFlipbook(lang);
        flipbooksLoaded[lang] = true;
    }
}

// Función para cerrar flipbook
function closeFlipbook(lang) {
    const config = pdfConfig[lang];
    $(config.modalId).removeClass('active');
}

// Cerrar al hacer clic fuera del flipbook
$(document).on('click', '.flipbook-modal', function(e) {
    if ($(e.target).hasClass('flipbook-modal')) {
        $(this).removeClass('active');
    }
});

// Crear flipbook
async function createFlipbook(lang) {
    const config = pdfConfig[lang];
    
    try {
        const loadingTask = pdfjsLib.getDocument(config.url);
        const pdf = await loadingTask.promise;
        const numPages = pdf.numPages;
        
        $(config.flipbookId).empty();
        
        // Renderizar páginas
        for (let pageNum = 1; pageNum <= numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const viewport = page.getViewport({ scale: 2.0 });
            
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            
            await page.render({
                canvasContext: context,
                viewport: viewport
            }).promise;
            
            const imgData = canvas.toDataURL('image/jpeg', 0.95);
            $(config.flipbookId).append(`<div class="page"><img src="${imgData}" style="width:100%; height:100%; object-fit:contain;"></div>`);
            
            // Mostrar primera página como portada
            if (pageNum === 1) {
                $(config.coverId).html(`<img src="${imgData}">`);
            }
        }
        
        // Inicializar Turn.js en modo DOBLE PÁGINA
        $(config.flipbookId).turn({
            width: 1000,
            height: 650,
            autoCenter: true,
            gradients: true,
            elevation: 50,
            duration: 1200,
            acceleration: true,
            display: 'double'
        });
        
        // Navegación con flechas
        $(config.prevBtn).click(function() {
            $(config.flipbookId).turn('previous');
        });
        
        $(config.nextBtn).click(function() {
            $(config.flipbookId).turn('next');
        });
        
        // Actualizar contador y botones
        $(config.flipbookId).bind('turned', function(event, page, view) {
            const currentPage = $(config.flipbookId).turn('page');
            const totalPages = $(config.flipbookId).turn('pages');
            
            $(config.counterId).text(`${config.pageText} ${currentPage} de ${totalPages}`);
            $(config.prevBtn).prop('disabled', currentPage === 1);
            $(config.nextBtn).prop('disabled', currentPage === totalPages);
        });
        
        // Estado inicial
        $(config.prevBtn).prop('disabled', true);
        $(config.counterId).text(`${config.pageText} 1 de ${numPages}`);
        
    } catch (error) {
        console.error('Error cargando PDF:', error);
        $(config.flipbookId).html('<div class="loading">Error al cargar el PDF</div>');
    }
}
</script>

</body>
</html>
