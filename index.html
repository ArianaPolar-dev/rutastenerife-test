<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="es" style="background-color: #8c8c8c">
<head>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="author" content="casa">
<title>Costa Adeje</title>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Turn.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style type="text/css">
body { 
    background-color: #fff; 
    margin-top: 2%; 
    margin-left: 4%; 
    margin-right: 4%; 
    margin-bottom: 2%; 
    padding: 4%; 
    border-width: 1px; 
    border-color: black; 
    border-style: solid; 
}

.topnav { 
    background-color: #4CAF50; 
    overflow: hidden; 
}

.topnav a { 
    float: left; 
    display: block; 
    color: #f2f2f2; 
    text-align: center; 
    padding: 18px 20px; 
    text-decoration: none; 
    font-size: 21px; 
}

.topnav a:hover { 
    background-color: #ddd; 
    color: black; 
}

.topnav a.active { 
    background-color: #04AA6D; 
    color: white; 
}

/* Título principal */
.main-title {
    color: #E36C0A;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 48pt;
    text-align: center;
    margin: 30px 0;
}

/* Container de los flipbooks */
.flipbooks-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin: 40px 0;
}

.flipbook-box {
    border: 4px solid #E36C0A;
    padding: 25px;
    background-color: #fff;
    border-radius: 10px;
    position: relative;
}

.flipbook-title {
    color: #E36C0A;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 28pt;
    text-align: center;
    margin-bottom: 20px;
    margin-top: 10px;
}

/* Contenedor del flipbook */
.flipbook-wrapper {
    width: 100%;
    height: 650px;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #f9f9f9;
    border-radius: 5px;
    overflow: hidden;
}

.flipbook {
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.flipbook .page {
    background-color: white;
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
}

/* Controles de navegación */
.flipbook-controls {
    text-align: center;
    margin-top: 20px;
}

.control-btn {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 12px 25px;
    margin: 0 10px;
    cursor: pointer;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
}

.control-btn:hover {
    background-color: #04AA6D;
}

.control-btn:disabled {
    background-color: #ccc;
    cursor: not-allowed;
}

.page-indicator {
    display: inline-block;
    margin: 0 15px;
    color: #E36C0A;
    font-weight: bold;
    font-size: 16px;
}

.download-btn {
    display: block;
    background-color: #E36C0A;
    color: white;
    text-align: center;
    padding: 12px 20px;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    border-radius: 5px;
    margin-top: 15px;
}

.download-btn:hover {
    opacity: 0.8;
}

.loading {
    text-align: center;
    padding: 50px;
    color: #666;
    font-size: 18px;
}

/* Responsive */
@media (max-width: 1024px) {
    .flipbooks-container {
        grid-template-columns: 1fr;
    }
    
    .main-title {
        font-size: 36pt;
    }
    
    .flipbook-title {
        font-size: 24pt;
    }
    
    .flipbook-wrapper {
        height: 500px;
    }
}
</style>
</head>
<body>

<!-- Menú superior -->
<div class="topnav" id="myTopnav">
    <a href="index.html" class="active">Inicio</a>
    <a href="rutas6.html">Anterior</a>
    <a href="rutas1.html">Siguiente</a>
</div>

<br>

<!-- Título principal -->
<div class="main-title">
    COSTA ADEJE<br>TENERIFE
</div>

<!-- Container de los dos flipbooks -->
<div class="flipbooks-container">
    
    <!-- Recuadro 1: PDF en Español -->
    <div class="flipbook-box">
        <h2 class="flipbook-title">Rutas en Español</h2>
        
        <div class="flipbook-wrapper">
            <div id="flipbook-es" class="flipbook">
                <div class="loading">Cargando PDF...</div>
            </div>
        </div>
        
        <div class="flipbook-controls">
            <button class="control-btn" id="prev-es">← Anterior</button>
            <span class="page-indicator" id="page-es">Página 1</span>
            <button class="control-btn" id="next-es">Siguiente →</button>
        </div>
        
        <a href="Guia Rutas Tenerife Español.pdf" download class="download-btn">⬇ Descargar PDF</a>
    </div>
    
    <!-- Recuadro 2: PDF en Inglés -->
    <div class="flipbook-box">
        <h2 class="flipbook-title">Routes in English</h2>
        
        <div class="flipbook-wrapper">
            <div id="flipbook-en" class="flipbook">
                <div class="loading">Loading PDF...</div>
            </div>
        </div>
        
        <div class="flipbook-controls">
            <button class="control-btn" id="prev-en">← Previous</button>
            <span class="page-indicator" id="page-en">Page 1</span>
            <button class="control-btn" id="next-en">Next →</button>
        </div>
        
        <a href="Guide Rutas Tenerifes English.pdf" download class="download-btn">⬇ Download PDF</a>
    </div>
    
</div>

<script>
// Configurar PDF.js
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// Función para cargar y crear flipbook desde PDF (UNA SOLA PÁGINA)
async function createFlipbook(pdfUrl, flipbookId, prevBtnId, nextBtnId, pageIndicatorId) {
    try {
        // Cargar PDF
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        const pdf = await loadingTask.promise;
        const numPages = pdf.numPages;
        
        // Limpiar contenedor
        $(flipbookId).empty();
        
        // Renderizar cada página como imagen
        for (let pageNum = 1; pageNum <= numPages; pageNum++) {
            const page = await pdf.getPage(pageNum);
            const viewport = page.getViewport({ scale: 1.5 });
            
            // Crear canvas para cada página
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            
            // Renderizar página en canvas
            await page.render({
                canvasContext: context,
                viewport: viewport
            }).promise;
            
            // Convertir canvas a imagen y añadir al flipbook
            const imgData = canvas.toDataURL();
            $(flipbookId).append(`<div class="page" style="background-image: url('${imgData}')"></div>`);
        }
        
        // Inicializar Turn.js con DISPLAY: SINGLE (una sola página)
        $(flipbookId).turn({
            width: 550,
            height: 650,
            autoCenter: true,
            gradients: true,
            elevation: 50,
            duration: 1000,
            acceleration: true,
            display: 'single'
        });
        
        // Controles de navegación
        $(prevBtnId).click(function() {
            $(flipbookId).turn('previous');
        });
        
        $(nextBtnId).click(function() {
            $(flipbookId).turn('next');
        });
        
        // Actualizar indicador de página
        $(flipbookId).bind('turned', function(event, page, view) {
            const currentPage = $(flipbookId).turn('page');
            const totalPages = $(flipbookId).turn('pages');
            
            // Actualizar texto según idioma
            if (pageIndicatorId === '#page-es') {
                $(pageIndicatorId).text(`Página ${currentPage} de ${totalPages}`);
            } else {
                $(pageIndicatorId).text(`Page ${currentPage} of ${totalPages}`);
            }
            
            // Deshabilitar botones en límites
            $(prevBtnId).prop('disabled', currentPage === 1);
            $(nextBtnId).prop('disabled', currentPage === totalPages);
        });
        
        // Estado inicial
        $(prevBtnId).prop('disabled', true);
        if (pageIndicatorId === '#page-es') {
            $(pageIndicatorId).text(`Página 1 de ${numPages}`);
        } else {
            $(pageIndicatorId).text(`Page 1 of ${numPages}`);
        }
        
    } catch (error) {
        console.error('Error cargando PDF:', error);
        $(flipbookId).html('<div class="loading">Error al cargar el PDF</div>');
    }
}

// Inicializar ambos flipbooks cuando el documento esté listo
$(document).ready(function() {
    createFlipbook(
        'Guia Rutas Tenerife Español.pdf',
        '#flipbook-es',
        '#prev-es',
        '#next-es',
        '#page-es'
    );
    
    createFlipbook(
        'Guide Rutas Tenerifes English.pdf',
        '#flipbook-en',
        '#prev-en',
        '#next-en',
        '#page-en'
    );
});
</script>

</body>
</html>
