<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="es" style="background-color: #8c8c8c">
<head>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="author" content="casa">
<title>Costa Adeje</title>

<!-- DearFlip CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dearflip@2.7.15/css/dearflip.min.css">

<style type="text/css">
body { 
    background-color: #fff; 
    margin-top: 2%; 
    margin-left: 4%; 
    margin-right: 4%; 
    margin-bottom: 2%; 
    padding: 4%; 
    border-width: 1px; 
    border-color: black; 
    border-style: solid; 
}

.topnav { 
    background-color: #4CAF50; 
    overflow: hidden; 
}

.topnav a { 
    float: left; 
    display: block; 
    color: #f2f2f2; 
    text-align: center; 
    padding: 18px 20px; 
    text-decoration: none; 
    font-size: 21px; 
}

.topnav a:hover { 
    background-color: #ddd; 
    color: black; 
}

.topnav a.active { 
    background-color: #04AA6D; 
    color: white; 
}

/* Título principal */
.main-title {
    color: #E36C0A;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 48pt;
    text-align: center;
    margin: 30px 0;
}

/* Container de los flipbooks */
.flipbooks-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin: 40px 0;
}

.flipbook-box {
    padding: 25px;
    background-color: #fff;
    border-radius: 10px;
    position: relative;
}

.flipbook-title {
    color: #E36C0A;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 28pt;
    text-align: center;
    margin-bottom: 20px;
    margin-top: 0;
}

/* Contenedor del flipbook DearFlip */
._df_book {
    height: 650px;
    width: 100%;
    margin: 20px auto;
    background-color: #f9f9f9;
    border-radius: 5px;
}

/* Controles personalizados (ocultos porque DearFlip tiene propios) */
.flipbook-controls {
    text-align: center;
    margin-top: 20px;
    display: none;
}

.download-btn {
    display: block;
    background-color: #E36C0A;
    color: white;
    text-align: center;
    padding: 12px 20px;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    border-radius: 5px;
    margin-top: 15px;
}

.download-btn:hover {
    opacity: 0.8;
}

/* Responsive */
@media (max-width: 1024px) {
    .flipbooks-container {
        grid-template-columns: 1fr;
    }
    
    .main-title {
        font-size: 36pt;
    }
    
    .flipbook-title {
        font-size: 24pt;
    }
    
    ._df_book {
        height: 500px;
    }
}
</style>
</head>
<body>

<!-- Menú superior -->
<div class="topnav" id="myTopnav">
    <a href="index.html" class="active">Inicio</a>
    <a href="index.html">Anterior</a>
    <a href="rutas1.html">Siguiente</a>
</div>

<br>

<!-- Título principal -->
<div class="main-title">
    COSTA ADEJE<br>TENERIFE
</div>

<!-- Container de los dos flipbooks -->
<div class="flipbooks-container">
    
    <!-- Recuadro 1: PDF en Español -->
    <div class="flipbook-box">
        <h2 class="flipbook-title">Rutas en Español</h2>
        
        <div class="_df_book" 
             id="flipbook-es"
             source="Guia Rutas Tenerife Español.pdf" 
             webgl="true"
             height="650"
             sound="true"
             duration="800"
             backgroundcolor="#f9f9f9">
        </div>
        
        <a href="Guia Rutas Tenerife Español.pdf" download class="download-btn">⬇ Descargar PDF</a>
    </div>
    
    <!-- Recuadro 2: PDF en Inglés -->
    <div class="flipbook-box">
        <h2 class="flipbook-title">Routes in English</h2>
        
        <div class="_df_book" 
             id="flipbook-en"
             source="Guide Rutas Tenerifes English.pdf" 
             webgl="true"
             height="650"
             sound="true"
             duration="800"
             backgroundcolor="#f9f9f9">
        </div>
        
        <a href="Guide Rutas Tenerifes English.pdf" download class="download-btn">⬇ Download PDF</a>
    </div>
    
</div>

<!-- DearFlip JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/dearflip@2.7.15/js/dearflip.min.js"></script>

<script>
// Configuración adicional de DearFlip para ambos flipbooks
jQuery(document).ready(function($) {
    
    // Configurar flipbook español con opciones 3D y sonido
    if (window.DFLIP) {
        DFLIP.defaults = {
            webgl: true,              // Efecto 3D WebGL
            sound: true,              // Sonido al pasar páginas
            height: 650,              // Altura
            duration: 800,            // Duración animación (ms)
            hardConfig: "soft",       // Tipo de tapa (soft = suave)
            backgroundColor: "#f9f9f9",
            controlsPosition: "bottom", // Controles abajo
            pageMode: "single",       // Una página a la vez
            singlePageMode: "zoom",   // Modo zoom en página única
            autoEnableOutline: false,
            autoEnableThumbnail: false,
            overwritePDFOutline: false
        };
    }
    
    console.log('DearFlip 3D Flipbooks cargados con sonido');
});
</script>

</body>
</html>
