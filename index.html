<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="es" style="background-color: #8c8c8c">
<head>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<meta name="author" content="casa">
<title>Costa Adeje</title>

<!-- jQuery y Turn.js -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

<style type="text/css">
body { 
    background-color: #fff; 
    margin-top: 2%; 
    margin-left: 4%; 
    margin-right: 4%; 
    margin-bottom: 2%; 
    padding: 4%; 
    border-width: 1px; 
    border-color: black; 
    border-style: solid; 
}

p { 
    color: #E36C0A; 
    font-family: sans-serif; 
    font-weight: bold; 
    font-size: 48pt; 
    text-align: center; 
}

img { 
    display: block; 
    margin: 0 auto; 
    max-width: 100%; 
    height: auto; 
}

.topnav { 
    background-color: #4CAF50; 
    overflow: hidden; 
}

.topnav a { 
    float: left; 
    display: block; 
    color: #f2f2f2; 
    text-align: center; 
    padding: 18px 20px; 
    text-decoration: none; 
    font-size: 21px; 
}

.topnav a:hover { 
    background-color: #ddd; 
    color: black; 
}

.topnav a.active { 
    background-color: #04AA6D; 
    color: white; 
}

/* Título Costa Adeje */
.main-title {
    color: #E36C0A;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 48pt;
    text-align: center;
    margin: 30px 0;
}

/* Container de los PDFs */
.pdfs-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin: 40px 0;
}

.pdf-box {
    border: 4px solid #E36C0A;
    padding: 25px;
    background-color: #fff;
    border-radius: 10px;
    position: relative;
}

/* Número del recuadro */
.box-number {
    position: absolute;
    top: -25px;
    left: 20px;
    color: #E36C0A;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 60pt;
    background-color: #fff;
    padding: 0 15px;
}

.pdf-title {
    color: #E36C0A;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 28pt;
    text-align: center;
    margin-bottom: 20px;
    margin-top: 10px;
}

/* Visor de PDF embebido */
.pdf-viewer {
    width: 100%;
    height: 600px;
    border: 2px solid #ddd;
    border-radius: 5px;
}

.download-btn {
    display: block;
    background-color: #4CAF50;
    color: white;
    text-align: center;
    padding: 15px 20px;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
    border-radius: 5px;
    margin-top: 20px;
}

.download-btn:hover {
    background-color: #04AA6D;
}

/* Responsive */
@media (max-width: 1024px) {
    .pdfs-container {
        grid-template-columns: 1fr;
    }
    
    .main-title {
        font-size: 36pt;
    }
    
    .pdf-title {
        font-size: 24pt;
    }
    
    .pdf-viewer {
        height: 500px;
    }
}
</style>
</head>
<body>

<!-- Menú superior -->
<div class="topnav" id="myTopnav">
    <a href="index.html" class="active">Inicio</a>
    <a href="index.html">Anterior</a>
    <a href="rutas1.html">Siguiente</a>
</div>

<br>

<!-- Título principal -->
<div class="main-title">
    COSTA ADEJE<br>TENERIFE
</div>

<!-- Container de los dos PDFs (AQUÍ VA DONDE ESTABA LA IMAGEN) -->
<div class="pdfs-container">
    
    <!-- Recuadro 1: PDF en Español -->
    <div class="pdf-box">
        <div class="box-number">1</div>
        <h2 class="pdf-title">Rutas en Español</h2>
        <embed class="pdf-viewer" 
               src="Guia Rutas Tenerife Español.pdf" 
               type="application/pdf">
        <a href="Guia Rutas Tenerife Español.pdf" download class="download-btn">⬇ Descargar PDF</a>
    </div>
    
    <!-- Recuadro 2: PDF en Inglés -->
    <div class="pdf-box">
        <div class="box-number">2</div>
        <h2 class="pdf-title">Routes in English</h2>
        <embed class="pdf-viewer" 
               src="Guide Rutas Tenerifes English.pdf" 
               type="application/pdf">
        <a href="Guide Rutas Tenerifes English.pdf" download class="download-btn">⬇ Download PDF</a>
    </div>
    
</div>

</body>
</html>
